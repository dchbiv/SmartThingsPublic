name: Build Website Monitor APK

on:
  push:
    paths:
      - "android-website-monitor/**"
      - ".github/workflows/android-website-monitor.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-website-monitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: website-monitor-debug-apk
          path: android-website-monitor/app/build/outputs/apk/debug/*.apk
